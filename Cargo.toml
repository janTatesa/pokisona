[package]
name = "pokisona"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["advanced", "smol"] }
dirs = "6.0.0"
bitflags = "2.10.0"
itertools = "0.14.0"
lucide-icons = { version = "*", features = ["iced"] }
strum = { version = "0.27.2", features = ["derive"] }
iced_highlighter = "0.14.0"
chumsky = { version = "0.12.0", features = ["lexical-numbers"] }
jiff = { version = "0.2.34", features = ["serde"] }
anyhow = "1.0.103"
rand = "0.10.2"
clap = { version = "4.6.4", features = ["cargo", "derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.33"
env_logger = "0.11.11"
fuzzy-search = "0.1.0"
norm = { version = "0.1.1", features = ["fzf-v2"] }
